@if (auth.isAuthenticated()) {
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">◈</span>
        <span class="brand-name">DocRAG</span>
      </div>

      <button type="button" class="theme-toggle" (click)="toggleTheme()"
        [attr.aria-label]="isLightTheme ? 'Activer le mode sombre' : 'Activer le mode clair'">
        @if (isLightTheme) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/>
          </svg>
          <span>Mode sombre</span>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
          </svg>
          <span>Mode clair</span>
        }
      </button>

      <nav class="nav">
        <a routerLink="/chat" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Assistant</span>
        </a>
        @if (auth.isAdmin()) {
          <a routerLink="/documents" routerLinkActive="active" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <span>Documents</span>
          </a>
        }
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-meta">
            <span class="user-name">{{ displayName() }}</span>
            <span class="user-role">{{ auth.user()?.role }}</span>
          </div>
          <button type="button" class="btn-logout" (click)="logout()" title="Déconnexion">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>

        <div
          class="status-pill"
          [class.online]="status?.documents_loaded"
          [class.offline]="!status?.documents_loaded"
        >
          <span class="dot"></span>
          @if (status?.documents_loaded) {
            <span>{{ status?.total_documents }} doc(s) indexé(s)</span>
          } @else {
            <span>Base non chargée</span>
          }
        </div>
      </div>
    </aside>

    <main class="main">
      <router-outlet />
    </main>
  </div>
} @else {
  <button type="button" class="theme-toggle public-theme-toggle" (click)="toggleTheme()"
    [attr.aria-label]="isLightTheme ? 'Activer le mode sombre' : 'Activer le mode clair'">
    @if (isLightTheme) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/>
      </svg>
      <span>Mode sombre</span>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
      </svg>
      <span>Mode clair</span>
    }
  </button>
  <router-outlet />
}
